<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="四队现场版代号图像主持题板" />
    <title>玩家题板 · 代号：图像</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-view="play">
    <main class="shell play-shell">
      <header class="topbar play-topbar">
        <a class="brand" id="master-link" href="./index.html" aria-label="打开队长答案页">
          <span class="brand-mark" aria-hidden="true">⌁</span>
          <span><strong>代号：图像</strong><small>主持人主控</small></span>
        </a>

        <form class="compact-seed-form" id="seed-form">
          <label for="game-code">局号</label>
          <input id="game-code" name="game" maxlength="10" autocomplete="off" spellcheck="false" />
          <button class="button button-quiet" type="submit">载入</button>
        </form>

        <button class="button button-quiet fullscreen-button" id="fullscreen" type="button">全屏</button>
      </header>

      <div class="game-layout">
        <section class="game-board" id="game-board" aria-label="5乘5图片题板"></section>

        <aside class="host-sidebar" id="turn-console" data-team="prep" aria-label="主持人控制台">
          <div class="turn-heading">
            <span class="section-label">现在是谁的回合？</span>
            <div class="turn-title-row">
              <h1 id="current-team-name">全体队长准备</h1>
              <span class="round-label" id="round-label">准备阶段</span>
            </div>
            <p id="phase-instruction">四位队长一起查看答案；队友只看左侧图片。</p>
          </div>

          <div class="timer" aria-label="回合计时器">
            <div class="timer-copy">
              <span id="timer-phase">全体队长思考</span>
              <strong id="timer-display">02:00</strong>
            </div>
            <div class="timer-controls">
              <button class="timer-toggle" id="timer-toggle" type="button">开始准备</button>
              <button class="icon-button" id="timer-reset" type="button" aria-label="重新计时" title="重新计时">↻</button>
            </div>
          </div>

          <button class="button button-answer" id="start-answering" type="button" disabled>开始答题 <span>+ 1:00</span></button>

          <div class="team-switcher" id="team-switcher" role="group" aria-label="四队状态与当前队伍"></div>

          <div class="turn-actions">
            <button class="button button-primary" id="next-team" type="button" disabled>下一个队伍 <span aria-hidden="true">→</span></button>
            <button class="button button-secondary" id="refresh-images" type="button">刷新表面图片</button>
          </div>

          <p class="game-message" id="game-message" role="status" aria-live="polite">先开始 2 分钟的全体队长准备时间。</p>

          <button class="text-button reset-board" id="reset-board" type="button">重置本局进度</button>
        </aside>
      </div>
    </main>

    <div class="game-over" id="elimination-notice" hidden>
      <div class="game-over-card" role="dialog" aria-modal="true" aria-labelledby="elimination-title">
        <span class="assassin-mark" aria-hidden="true">×</span>
        <p class="eyebrow">ASSASSIN</p>
        <h2 id="elimination-title">触发黑色，队伍出局</h2>
        <p id="elimination-copy"></p>
        <button class="button button-secondary" id="dismiss-elimination" type="button">开始下一队</button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
