<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="四队现场版代号图像主持题板" />
    <title>玩家题板 · 代号：图像</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-view="play">
    <main class="shell play-shell">
      <header class="topbar play-topbar">
        <a class="brand" href="./index.html" aria-label="返回开始页面">
          <span class="brand-mark" aria-hidden="true">⌁</span>
          <span><strong>代号：图像</strong><small>主持人主控</small></span>
        </a>

        <div class="board-toolbar" aria-label="题板工具">
          <span class="game-code-pill">局号 <strong id="game-code-label">—</strong></span>
          <button class="button button-quiet" id="refresh-images" type="button">换图片</button>
          <button class="button button-quiet" id="refresh-layout" type="button">换分布</button>
          <button class="button button-secondary" id="copy-master-link" type="button">复制队长答案链接</button>
          <button class="button button-quiet fullscreen-button" id="fullscreen" type="button">全屏</button>
        </div>
      </header>

      <p class="toolbar-feedback" id="copy-master-feedback" role="status" aria-live="polite"></p>

      <div class="game-layout">
        <section class="game-board" id="game-board" aria-label="5乘5图片题板"></section>

        <aside class="host-sidebar" id="turn-console" data-team="prep" aria-label="主持人控制台">
          <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-label="拖动调整主持人控制台宽度" aria-orientation="vertical" aria-valuemin="320" aria-valuemax="820" tabindex="0"><span aria-hidden="true">⋮</span></div>
          <div class="turn-heading">
            <span class="section-label">现在是谁的回合？</span>
            <div class="turn-title-row">
              <h1 id="current-team-name">全体队长准备</h1>
              <div class="turn-meta">
                <span class="round-label" id="round-label">准备阶段</span>
                <button class="settings-button" id="timer-settings" type="button" aria-label="时间设置" title="时间设置">⚙</button>
              </div>
            </div>
            <p id="phase-instruction">四位队长一起查看答案；队友只看左侧图片。</p>
          </div>

          <div class="timer" aria-label="回合计时器">
            <div class="timer-copy">
              <span id="timer-phase">全体队长思考</span>
              <strong id="timer-display">02:00</strong>
            </div>
            <div class="timer-controls">
              <button class="timer-toggle" id="timer-toggle" type="button">开始准备</button>
              <button class="timer-skip" id="timer-skip" type="button">跳过</button>
              <button class="icon-button" id="timer-reset" type="button" aria-label="重新计时" title="重新计时">↻</button>
            </div>
          </div>

          <button class="button button-answer" id="start-answering" type="button" disabled>开始答题 <span>+ 1:00</span></button>

          <div class="team-switcher" id="team-switcher" role="group" aria-label="四队状态与当前队伍"></div>

          <div class="turn-actions">
            <button class="button button-primary" id="next-team" type="button" disabled>下一个队伍 <span aria-hidden="true">→</span></button>
          </div>

          <p class="game-message" id="game-message" role="status" aria-live="polite">先开始 2 分钟的全体队长准备时间。</p>

          <button class="text-button reset-board" id="reset-board" type="button">重置本局进度</button>
        </aside>
      </div>
    </main>

    <div class="game-over" id="elimination-notice" hidden>
      <div class="game-over-card" role="dialog" aria-modal="true" aria-labelledby="elimination-title">
        <span class="assassin-mark" aria-hidden="true">×</span>
        <p class="eyebrow">ASSASSIN</p>
        <h2 id="elimination-title">触发黑色，队伍出局</h2>
        <p id="elimination-copy"></p>
        <button class="button button-secondary" id="dismiss-elimination" type="button">开始下一队</button>
      </div>
    </div>

    <div class="settings-modal" id="timer-settings-modal" hidden>
      <form class="settings-panel" id="timer-settings-form" role="dialog" aria-modal="true" aria-labelledby="timer-settings-title">
        <div class="settings-heading">
          <div>
            <p class="eyebrow">TIMER SETTINGS</p>
            <h2 id="timer-settings-title">时间安排</h2>
          </div>
          <button class="settings-close" id="timer-settings-close" type="button" aria-label="关闭时间设置">×</button>
        </div>

        <p class="settings-help">保存后会按新设置重新开始当前阶段；之后的新回合也会沿用。</p>

        <label class="time-setting" for="settings-prep-minutes">
          <span><strong>开场准备</strong><small>四位队长共同查看答案</small></span>
          <span class="time-input"><input id="settings-prep-minutes" type="number" min="0.25" max="60" step="0.25" required /><em>分钟</em></span>
        </label>

        <label class="time-setting" for="settings-clue-seconds">
          <span><strong>队长思考</strong><small>每队开始回合后的提示时间</small></span>
          <span class="time-input"><input id="settings-clue-seconds" type="number" min="5" max="600" step="5" required /><em>秒</em></span>
        </label>

        <label class="time-setting" for="settings-guess-seconds">
          <span><strong>队员答题</strong><small>会与剩余队长时间相加</small></span>
          <span class="time-input"><input id="settings-guess-seconds" type="number" min="5" max="600" step="5" required /><em>秒</em></span>
        </label>

        <div class="settings-actions">
          <button class="text-button" id="timer-settings-defaults" type="button">恢复默认</button>
          <button class="button button-primary" type="submit">保存时间安排</button>
        </div>
      </form>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
