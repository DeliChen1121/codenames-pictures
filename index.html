<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="四队现场版代号图像 Master Card 生成器" />
    <title>Master Card · 代号：图像</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-view="master">
    <main class="shell master-shell">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="返回 Master Card">
          <span class="brand-mark" aria-hidden="true">⌁</span>
          <span><strong>代号：图像</strong><small>四队现场版</small></span>
        </a>
        <span class="privacy-pill"><span aria-hidden="true">●</span> 队长专用</span>
      </header>

      <section class="master-layout">
        <div class="master-copy">
          <p class="eyebrow">MASTER CARD</p>
          <h1>先生成答案，<br />再开启题板。</h1>
          <p class="lede">每一局由唯一局号锁定 25 张图片和颜色位置。请只在队长能看到的设备上使用此页。</p>

          <form class="seed-form" id="seed-form">
            <label for="game-code">局号</label>
            <div class="seed-input-row">
              <input id="game-code" name="game" maxlength="10" autocomplete="off" spellcheck="false" aria-describedby="seed-help" />
              <button class="button button-quiet" type="submit">载入</button>
            </div>
            <small id="seed-help">输入已有局号，或生成一局新的答案。</small>
          </form>

          <div class="master-actions">
            <button class="button button-primary" id="new-game" type="button">生成新局</button>
            <a class="button button-secondary" id="open-play" href="./play.html">打开玩家题板</a>
          </div>

          <button class="copy-link" id="copy-link" type="button">复制玩家题板链接</button>
          <p class="inline-feedback" id="copy-feedback" role="status" aria-live="polite"></p>
        </div>

        <div class="master-board-panel">
          <div class="panel-heading">
            <div>
              <span class="section-label">本局答案</span>
              <strong id="master-code-label">—</strong>
            </div>
            <button class="reveal-control" id="reveal-master" type="button" aria-pressed="false">
              <span aria-hidden="true">◉</span> 显示答案
            </button>
          </div>

          <div class="master-board is-hidden" id="master-board" aria-label="5乘5答案卡"></div>

          <div class="legend" aria-label="颜色分配">
            <span><i class="dot red"></i>红队 5</span>
            <span><i class="dot yellow"></i>黄队 5</span>
            <span><i class="dot blue"></i>蓝队 5</span>
            <span><i class="dot green"></i>绿队 5</span>
            <span><i class="dot black"></i>黑色 1</span>
            <span><i class="dot white"></i>白色 4</span>
          </div>
        </div>
      </section>

      <section class="master-note">
        <span class="note-index">01</span>
        <p><strong>推荐流程</strong>：队长生成新局 → 打开或分享玩家题板 → 主持人在大屏上控制揭牌和回合。</p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
