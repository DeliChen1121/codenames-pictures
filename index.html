<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="四队现场版代号图像游戏" />
    <title>代号：图像 · 四队现场版</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-view="start">
    <main class="start-shell">
      <section class="start-card" aria-labelledby="start-title">
        <p class="eyebrow">CODENAMES · PICTURES</p>
        <div class="team-spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1 id="start-title">代号：图像</h1>
        <p class="start-lede">四队现场对战。每队由一位队长查看答案，其余队员根据“一个词 + 一个数字”的提示猜图片。</p>

        <div class="start-rules" aria-label="游戏规则简介">
          <p><strong>25 张图片</strong><span>红、黄、蓝、绿各 5 张，另有 1 张黑色和 4 张白色。</span></p>
          <p><strong>猜中本队</strong><span>可以继续；翻到其他队、白色或主动结束时换下一队。</span></p>
          <p><strong>翻到黑色</strong><span>当前队伍淘汰；同一轮完成的队伍并列。</span></p>
        </div>

        <button class="button button-primary start-button" id="start-game" type="button">开始游戏 <span aria-hidden="true">→</span></button>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
